[project]
name = "mdg"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
package-mode = "false"

readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets (>=3.6.0,<4.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "datetime (>=5.5,<6.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "nltk (>=3.9.1,<4.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "numpy (>=1.26.0,<2.1.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "transformers (>=4.56.0,<5.0.0)",
    "torch (>=2.8.0,<3.0.0)",
]

[tool.black]
line-length = 128

[tool.mypy]
strict = true
check_untyped_defs = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipython = "^9.3.0"
jupyter = "^1.1.1"
